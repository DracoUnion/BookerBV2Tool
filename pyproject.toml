[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BookerBV2Tool"
version = "2026.3.25.0"
authors = [
    { name = "wizardforcel", email = "wizard.z@qq.com" },
]
description = "iBooker/DracoUnion BV2 辅助工具"
readme = "README.md"
license = { text = "SATA" }
requires-python = ">=3.6"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: Other/Proprietary License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Localization",
    "Topic :: Utilities",
]
keywords = [
    "TTS",
    "AI",
    "语音转文本",
    "人工智能",
    "声音克隆",
]
dependencies = [
    "librosa",
    "soundfile",
    "torch",
    "funasr",
    "pypinyin",
    "num2words",
    "pyopenjtalk",
    "jaconv",
    "jieba",
    "cn2an",
]

[project.urls]
Homepage = "https://github.com/DracoUnion/BookerBV2Tool"

[project.scripts]
BookerBV2Tool = "BookerBV2Tool.__main__:main"
bv2-tool = "BookerBV2Tool.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["BookerBV2Tool*"]

[tool.setuptools.package-data]
"*" = ["*"]